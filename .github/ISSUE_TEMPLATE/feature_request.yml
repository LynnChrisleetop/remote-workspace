name: Feature request
description: 想要的能力 / 适配的环境
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，而不是直接给方案
      placeholder: 我有三台开发机，希望 ……
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想怎么做
      description: 可选。有没有参考实现（比如别的工具怎么做的）
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 比如 SSHFS 挂载、本地镜像插件、手动 tmux 等，效果如何
